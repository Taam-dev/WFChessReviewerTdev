# ══════════════════════════════════════════════════════════════════
# WFChessReviewerTdev — GitHub Actions CI Workflow
# ══════════════════════════════════════════════════════════════════
# Runs on every push and pull request to main/develop branches.
# Performs: linting, type checking, and unit testing.
# Browser tests (Playwright) are skipped in CI unless explicitly tagged.
# ══════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual triggering

env:
  PYTHON_VERSION: "3.11"
  # Force headless mode and instant polls in CI
  BROWSER_HEADLESS: "true"
  SLOW_MO: "0"
  EMAIL_POLL_INTERVAL: "0.1"
  EMAIL_POLL_MAX_ATTEMPTS: "2"
  LOG_LEVEL: "DEBUG"

jobs:
  # ── Lint & Format Check ──────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check code formatting with Black
        run: black --check --diff src/ tests/

      - name: Check import ordering with isort
        run: isort --check-only --diff src/ tests/

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=88 \
            --extend-ignore=E203,W503,D100,D101,D102,D103,D104 \
            --statistics

  # ── Type Checking ─────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  # ── Unit Tests ────────────────────────────────────────────────
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Create required directories
        run: |
          mkdir -p screenshots logs credentials assets

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            -m "not integration and not slow" \
            --cov=src/WFChessReviewerTdev \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ── Build Package ─────────────────────────────────────────────
  build:
    name: Build Distribution Package
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Check built distributions
        run: |
          pip install twine
          twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 7