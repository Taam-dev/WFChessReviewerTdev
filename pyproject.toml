[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "WFChessReviewerTdev"
version = "1.0.0"
description = "Chess.com Account Automation & Match History Reviewer Desktop Tool"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "WFChessReviewerTdev Contributors", email = "noreply@example.com" },
]
keywords = [
    "chess",
    "automation",
    "playwright",
    "gui",
    "customtkinter",
    "web-scraping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Games/Entertainment :: Board Games",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "responses>=0.24.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
wfchess = "WFChessReviewerTdev.app:run_app"

[project.urls]
Homepage = "https://github.com/yourusername/WFChessReviewerTdev"
Repository = "https://github.com/yourusername/WFChessReviewerTdev"
"Bug Tracker" = "https://github.com/yourusername/WFChessReviewerTdev/issues"
Changelog = "https://github.com/yourusername/WFChessReviewerTdev/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"WFChessReviewerTdev" = ["py.typed"]

# ── Black formatting ─────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

# ── isort import sorting ──────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["WFChessReviewerTdev"]

# ── mypy type checking ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src"]

# ── pytest configuration ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
]
markers = [
    "unit: Pure unit tests (no network, no browser)",
    "integration: Tests requiring network access",
    "slow: Tests that take more than 5 seconds",
]

# ── Coverage configuration ────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]